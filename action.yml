name: 'PR Test Agent'
description: 'Autonomous agent that writes pytest tests for code changed in a pull request'
inputs:
  groq-api-key:
    description: 'Groq API Key'
    required: true
  model:
    description: 'Groq model ID'
    required: false
    default: 'qwen/qwen3.8-27b'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  install-command:
    description: 'Command to install target repository dependencies'
    required: false
    default: 'pip install -r requirements.txt'
  base-ref:
    description: 'Base git reference to compare against'
    required: false
  max-steps:
    description: 'Maximum agent steps'
    required: false
    default: ''
  max-tokens:
    description: 'Maximum total tokens budget'
    required: false
    default: ''
  max-fix-attempts:
    description: 'Maximum test fix attempts'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up target repository environment
      shell: bash
      env:
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        python -m venv "${RUNNER_TEMP}/target_venv"
        "${RUNNER_TEMP}/target_venv/bin/pip" install --upgrade pip
        "${RUNNER_TEMP}/target_venv/bin/pip" install pytest pytest-asyncio pytest-cov
        if [ -n "$INPUT_INSTALL_COMMAND" ]; then
          cd "$GITHUB_WORKSPACE"
          PATH="${RUNNER_TEMP}/target_venv/bin:$PATH"
          VIRTUAL_ENV="${RUNNER_TEMP}/target_venv"
          bash -c "$INPUT_INSTALL_COMMAND"
        fi

    - name: Set up pr-test-agent environment
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m venv "${RUNNER_TEMP}/agent_venv"
        "${RUNNER_TEMP}/agent_venv/bin/pip" install --upgrade pip
        "${RUNNER_TEMP}/agent_venv/bin/pip" install "$ACTION_PATH"

    - name: Run pr-test-agent
      shell: bash
      env:
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        GROQ_MODEL: ${{ inputs.model }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_MAX_STEPS: ${{ inputs.max-steps }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_MAX_FIX_ATTEMPTS: ${{ inputs.max-fix-attempts }}
      run: |
        mkdir -p "${RUNNER_TEMP}/pr-test-agent-output/logs"
        JSON_OUT="${RUNNER_TEMP}/pr-test-agent-output/results.json"
        COMMENT_OUT="${RUNNER_TEMP}/pr-test-agent-output/comment.md"
        LOG_DIR="${RUNNER_TEMP}/pr-test-agent-output/logs"

        BASE_REF="${INPUT_BASE_REF:-$GITHUB_BASE_REF}"
        if [[ ! "$BASE_REF" =~ ^origin/ ]]; then
          BASE_REF="origin/$BASE_REF"
        fi

        EXTRA_ARGS=()
        if [ -n "$INPUT_MAX_STEPS" ]; then
          EXTRA_ARGS+=(--max-steps "$INPUT_MAX_STEPS")
        fi
        if [ -n "$INPUT_MAX_TOKENS" ]; then
          EXTRA_ARGS+=(--max-tokens "$INPUT_MAX_TOKENS")
        fi
        if [ -n "$INPUT_MAX_FIX_ATTEMPTS" ]; then
          EXTRA_ARGS+=(--max-fix-attempts "$INPUT_MAX_FIX_ATTEMPTS")
        fi

        set +e
        "${RUNNER_TEMP}/agent_venv/bin/pr-test-agent" run \
          --repo "$GITHUB_WORKSPACE" \
          --base "$BASE_REF" \
          --python "${RUNNER_TEMP}/target_venv/bin/python" \
          --log-dir "$LOG_DIR" \
          --json-out "$JSON_OUT" \
          --comment-out "$COMMENT_OUT" \
          "${EXTRA_ARGS[@]}"
        CLI_EXIT=$?
        set -e
        echo "$CLI_EXIT" > "${RUNNER_TEMP}/pr-test-agent-output/exit_code"

    - name: Post or update PR comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        COMMENT_OUT="${RUNNER_TEMP}/pr-test-agent-output/comment.md"
        JSON_OUT="${RUNNER_TEMP}/pr-test-agent-output/results.json"

        if [ -z "$PR_NUMBER" ]; then
          echo "No pull request number found, skipping comment."
          exit 0
        fi

        if [ ! -f "$COMMENT_OUT" ]; then
          echo -e "<!-- pr-test-agent -->\n### PR Test Agent\n\nAgent encountered a fatal error before generating a comment. Please check workflow run logs." > "$COMMENT_OUT"
        fi

        COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("<!-- pr-test-agent -->")) | .id' | head -n 1)

        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@"$COMMENT_OUT"
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$COMMENT_OUT"
        fi

        CLI_EXIT=0
        if [ -f "${RUNNER_TEMP}/pr-test-agent-output/exit_code" ]; then
          CLI_EXIT=$(cat "${RUNNER_TEMP}/pr-test-agent-output/exit_code")
        fi

        IS_CRASH=1
        if [ -f "$JSON_OUT" ]; then
          if python3 -c 'import json, sys; d=json.load(open(sys.argv[1])); sys.exit(0 if "stop_reason" in d else 1)' "$JSON_OUT" 2>/dev/null; then
            IS_CRASH=0
          fi
        fi

        if [ "$IS_CRASH" -eq 1 ] && [ "$CLI_EXIT" -ne 0 ]; then
          echo "pr-test-agent crashed with exit code $CLI_EXIT" >&2
          exit "$CLI_EXIT"
        fi

    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr-test-agent-artifacts
        path: |
          ${{ runner.temp }}/pr-test-agent-output/results.json
          ${{ runner.temp }}/pr-test-agent-output/logs/*.jsonl
        if-no-files-found: ignore
